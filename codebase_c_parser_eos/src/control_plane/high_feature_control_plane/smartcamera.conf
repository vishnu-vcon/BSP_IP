# nginx/smartcamera.conf
#
# Reverse proxy + TLS termination for the SmartCamera C server.
#
# INSTALL STEPS (run as root / sudo):
#
#   1. Install nginx and OpenSSL:
#        sudo apt install nginx openssl
#
#   2. Generate a self-signed cert (development):
#        sudo mkdir -p /etc/nginx/ssl/smartcamera
#        sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#            -keyout /etc/nginx/ssl/smartcamera/server.key \
#            -out    /etc/nginx/ssl/smartcamera/server.crt \
#            -subj   "/CN=smartcamera.local"
#
#      For production use Let's Encrypt instead:
#        sudo apt install certbot python3-certbot-nginx
#        sudo certbot --nginx -d your.domain.com
#
#   3. Copy this file and enable it:
#        sudo cp nginx/smartcamera.conf /etc/nginx/sites-available/smartcamera
#        sudo ln -s /etc/nginx/sites-available/smartcamera \
#                   /etc/nginx/sites-enabled/smartcamera
#        sudo rm -f /etc/nginx/sites-enabled/default   # remove default site
#
#   4. Test and reload:
#        sudo nginx -t
#        sudo systemctl reload nginx
#
#   5. Run your C server on port 8000 (nginx talks to it internally):
#        export SMTP_PASSWORD="your_app_password"
#        ./smartcamera_server
#
# WHAT EACH SECTION DOES:
#   - limit_req_zone  : rate-limit zone (10 MB shared memory, 5 req/min per IP)
#   - ssl_*           : OpenSSL settings — TLS 1.2/1.3 only, strong ciphers
#   - location /      : proxy all traffic to the C server on localhost:8000
#   - location /login : extra tight rate limit on login to block brute force
#   - server (port 80): redirect all plain HTTP → HTTPS permanently
# ─────────────────────────────────────────────────────────────────────────────

# Rate-limit zone: track by client IP, 10 MB memory, max 5 requests/minute.
# 1 MB ≈ 16,000 IP addresses, so 10 MB handles ~160,000 concurrent clients.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# ── HTTPS server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;          # IPv6 support
    server_name smartcamera.local; # change to your hostname / IP

    # ── Layer 2: OpenSSL / TLS ──────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/smartcamera/server.crt;
    ssl_certificate_key /etc/nginx/ssl/smartcamera/server.key;

    # Only allow TLS 1.2 and 1.3 — older versions have known vulnerabilities
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong cipher suite — disables weak/export ciphers and MD5
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:'
                'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:'
                'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:'
                '!aNULL:!MD5:!RC4:!3DES';
    ssl_prefer_server_ciphers on;

    # TLS session cache: 1 MB holds ~4000 sessions, reuse for 1 hour
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 1h;

    # HSTS: tell browsers to always use HTTPS for 1 year (enable after testing)
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "DENY"            always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "no-referrer"     always;

    # ── Layer 3: nginx routing ──────────────────────────────────────────────

    # /login — tightest rate limit: 5 req/min, burst of 3, no delay
    # "nodelay" means the 3 burst slots are consumed immediately (no queue),
    # so the 4th request in a burst gets 429 right away instead of waiting.
    location /login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_read_timeout 30s;
    }

    # All other routes — proxy to the C server with no extra rate limit
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_read_timeout 60s;

        # Increase buffer for large responses (e.g. /device/status)
        proxy_buffer_size        16k;
        proxy_buffers            4 16k;
        proxy_busy_buffers_size  32k;
    }

    # ── Logging ─────────────────────────────────────────────────────────────
    access_log /var/log/nginx/smartcamera_access.log;
    error_log  /var/log/nginx/smartcamera_error.log warn;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name smartcamera.local;

    # 301 permanent redirect — browsers will cache this
    return 301 https://$host$request_uri;
}
