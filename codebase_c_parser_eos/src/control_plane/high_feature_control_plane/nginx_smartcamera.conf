# nginx_smartcamera.conf — NXP board at 192.168.10.184
#
# Place this file at: /etc/nginx/sites-available/smartcamera
# Then enable it:
#   sudo ln -s /etc/nginx/sites-available/smartcamera \
#              /etc/nginx/sites-enabled/smartcamera
#   sudo nginx -t          # test config — must say "ok"
#   sudo systemctl reload nginx

server {
    listen 443 ssl;
    server_name 192.168.1.160;           # NXP board IP

    # ── Certificate files (generated by gen_cert.sh) ──
    ssl_certificate     /etc/nginx/ssl/smartcamera.crt;
    ssl_certificate_key /etc/nginx/ssl/smartcamera.key;

    # ── TLS settings (OpenSSL does this work, not your C code) ──
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Proxy all requests to your C server on plain HTTP ──
    location / {
        proxy_pass         http://127.0.0.1:8080;   # C server port
        proxy_http_version 1.1;

        # Pass real client IP and protocol to C server
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    server_name 192.168.1.160	;
    return 301 https://$host$request_uri;
}
